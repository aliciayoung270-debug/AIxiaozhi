function init(){
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(t){$('toast').textContent=t;$('toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').hidden=true,3500)}
function expired(t){return t.expiry&&t.expiry<today()}
function status(t){return expired(t)?'expired':t.status}
function cadence(t){return (t.freq==='daily'?'每天':t.freq==='weekly'?'每周'+['','一','二','三','四','五','六','日'][+t.day]:'每月 '+t.day+' 日')+' '+String(t.hour).padStart(2,'0')+':00'}
function next(t){if(status(t)!=='enabled')return '—';const start=now();for(let i=0;i<400;i++){let date=new Date(start.getTime()+i*86400000),ymd=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai'}).format(date),d=new Date(ymd+'T'+String(t.hour).padStart(2,'0')+':00:00+08:00');if(d<=start)continue;if(t.expiry&&ymd>t.expiry)return '—';const local=new Date(d.getTime()+8*3600000);if(t.freq==='weekly'&&(local.getUTCDay()||7)!==+t.day)continue;if(t.freq==='monthly'&&local.getUTCDate()!==+t.day)continue;return fmt(d)}return '—'}

function historyCutoff(){
  const local=new Date(now().getTime()+8*3600000),day=local.getUTCDate();
  local.setUTCDate(1);local.setUTCMonth(local.getUTCMonth()-3);
  const lastDay=new Date(Date.UTC(local.getUTCFullYear(),local.getUTCMonth()+1,0)).getUTCDate();
  local.setUTCDate(Math.min(day,lastDay));
  return fmt(new Date(local.getTime()-8*3600000));
}

function session(r){

  main.innerHTML=`<header class="st-session-head" data-feature-id="F006"><div class="st-session-identity"><div class="st-session-title"><h1>${esc(r.name)}</h1><span class="st-session-source">${clock}定时任务</span></div><div class="st-session-meta"><span>执行于 <time>${esc(r.time)}</time> · 北京时间</span><span class="st-tag ${ok?'':'error'}">${ok?'✓ 执行成功':'执行失败'}</span><span>耗时 ${esc(r.duration)}</span></div></div>${historyLink()}</header>

    <div id="sessionFollowups" role="log" aria-label="后续对话" aria-live="polite" class="st-session-thread-followups" data-feature-id="F008"></div>
  </div></div>
  <form class="input-wrap st-session-compose" id="sessionComposer" data-feature-id="F008"><div class="input-bar"><textarea id="sessionInput" rows="1" aria-label="继续对话" placeholder="继续追问，或告诉小织下一步做什么…"></textarea><button class="input-btn send" id="sessionSend" type="submit" aria-label="发送消息" title="发送消息" disabled><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button></div><p class="st-session-hint">本地对话演示 · Enter 发送，Shift + Enter 换行</p></form>`;

    return '已收到你的补充。你可以继续追问本次报告的广告投放、动销风险或处理建议。当前为本地对话演示，未调用真实 Agent，也不会修改定时任务配置。';
  }
  input.oninput=()=>{send.disabled=!input.value.trim();input.style.height='auto';input.style.height=Math.min(input.scrollHeight,parseFloat(getComputedStyle(input).maxHeight))+'px'};

  input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.keyCode!==229){e.preventDefault();$('sessionComposer').requestSubmit()}};
