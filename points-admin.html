<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>运营控制台 · 积分管理</title>
  <style>
    :root { --ink:#1f2329; --muted:#646a73; --line:#e5e6eb; --canvas:#f5f6f7; --surface:#fff; --blue:#3370ff; --blue-soft:#eef4ff; --green:#00a870; --orange:#f2932e; --purple:#7b61ff; --red:#d54941; --shadow:0 8px 24px rgba(31,35,41,.08); --radius:8px; --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
    * { box-sizing:border-box; } body { margin:0; min-width:1080px; background:var(--canvas); color:var(--ink); font:14px/1.5 var(--font); } button,input,select { font:inherit; } button { cursor:pointer; } .topbar { height:64px; display:flex; align-items:center; padding:0 32px; background:var(--surface); border-bottom:1px solid var(--line); } .brand { display:flex; align-items:center; gap:10px; margin-right:48px; font-weight:600; letter-spacing:.01em; } .brand-mark { display:grid; width:28px; height:28px; place-items:center; border-radius:7px; background:var(--blue); color:#fff; font-size:15px; } .nav { display:flex; height:100%; gap:28px; } .nav button { position:relative; border:0; padding:0; background:transparent; color:var(--muted); } .nav button.active { color:var(--blue); font-weight:600; } .nav button.active::after { position:absolute; right:0; bottom:0; left:0; height:3px; border-radius:3px 3px 0 0; background:var(--blue); content:""; } .operator { margin-left:auto; color:var(--muted); font-size:13px; } .operator b { color:var(--ink); font-weight:500; }
    .page { max-width:1440px; margin:0 auto; padding:32px; } .page-head { display:flex; align-items:flex-end; justify-content:space-between; } .page-head h1 { margin:0; font-size:24px; line-height:1.3; } .page-head p { margin:7px 0 0; color:var(--muted); } .page-head .sync { display:flex; align-items:center; gap:7px; color:var(--muted); font-size:13px; } .sync i { display:block; width:7px; height:7px; border-radius:50%; background:var(--green); }
    .panel { margin-top:24px; padding:20px 24px 24px; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); } .toolbar { display:flex; align-items:center; gap:12px; } .search { width:260px; padding:8px 12px; border:1px solid var(--line); border-radius:6px; outline:0; color:var(--ink); } .search:focus,select:focus,input:focus { border-color:var(--blue); box-shadow:0 0 0 3px var(--blue-soft); } select { min-width:136px; padding:8px 10px; border:1px solid var(--line); border-radius:6px; outline:0; color:var(--ink); background:var(--surface); } .spacer { flex:1; } .btn { min-height:34px; padding:0 14px; border:1px solid var(--line); border-radius:6px; background:var(--surface); color:var(--ink); font-weight:500; } .btn:hover { border-color:var(--blue); color:var(--blue); } .btn.primary { border-color:var(--blue); background:var(--blue); color:#fff; } .btn.primary:hover { background:#245bdb; color:#fff; } .btn:disabled { cursor:not-allowed; border-color:var(--line); background:#f2f3f5; color:#a8abb2; } .summary { display:flex; align-items:center; gap:8px; height:42px; margin-top:18px; padding:0 12px; border-radius:6px; background:var(--blue-soft); color:#3d5b9d; font-size:13px; } .summary strong { color:var(--blue); } .summary.hidden { display:none; }
    table { width:100%; margin-top:16px; border-collapse:collapse; text-align:left; } th { padding:11px 10px; border-bottom:1px solid var(--line); color:var(--muted); font-size:12px; font-weight:500; } td { padding:14px 10px; border-bottom:1px solid var(--line); vertical-align:middle; } tbody tr:hover { background:#fafafa; } .check { width:16px; height:16px; accent-color:var(--blue); } .entity { display:flex; align-items:center; gap:10px; } .avatar { display:grid; width:32px; height:32px; place-items:center; border-radius:7px; background:#f0f3ff; color:#526dc7; font-size:13px; font-weight:600; } .entity b { display:block; font-weight:500; } .entity span, .subtle { display:block; margin-top:2px; color:var(--muted); font-size:12px; } .tag { display:inline-flex; align-items:center; padding:2px 8px; border-radius:4px; font-size:12px; } .tag.enterprise { background:#f0edff; color:#6955c9; } .tag.pro { background:#eaf7f1; color:#16855d; } .tag.basic { background:#fff3e8; color:#bb6b18; } .tag.active { background:#eaf7f1; color:#16855d; } .tag.paused { background:#f2f3f5; color:#72777f; } .quota { color:var(--ink); font-weight:500; } .inherit { color:var(--muted); font-size:12px; } .row-edit { border:0; padding:0; background:transparent; color:var(--blue); } .row-edit:hover { text-decoration:underline; }
    .empty { padding:48px; color:var(--muted); text-align:center; } .modal-mask { position:fixed; inset:0; z-index:10; display:none; align-items:center; justify-content:center; background:rgba(31,35,41,.45); } .modal-mask.open { display:flex; } .modal { width:480px; border-radius:10px; background:var(--surface); box-shadow:var(--shadow); } .modal-head { display:flex; align-items:center; padding:20px 24px 16px; } .modal-head h2 { margin:0; font-size:18px; } .modal-close { margin-left:auto; border:0; background:transparent; color:var(--muted); font-size:20px; } .modal-body { padding:0 24px 24px; } .modal-desc { margin:0 0 18px; color:var(--muted); font-size:13px; } .field { margin-top:16px; } .field label { display:block; margin-bottom:7px; color:#3b3f45; font-size:13px; font-weight:500; } .field input, .field select { width:100%; min-width:0; padding:9px 10px; } .field .hint { margin-top:6px; color:var(--muted); font-size:12px; } .modal-foot { display:flex; justify-content:flex-end; gap:10px; padding:14px 24px; border-top:1px solid var(--line); } .toast { position:fixed; right:28px; bottom:28px; z-index:11; padding:10px 14px; border-radius:6px; background:#24272c; color:#fff; box-shadow:var(--shadow); opacity:0; transform:translateY(8px); transition:.2s; pointer-events:none; } .toast.show { opacity:1; transform:translateY(0); }
  </style>
</head>
<body>
  <header class="topbar"><div class="brand"><span class="brand-mark">织</span><span>织云运营控制台</span></div><nav class="nav"><button class="active" data-view="tenant">租户管理</button><button data-view="user">用户管理</button></nav><div class="operator">当前身份：<b>平台运营管理员</b></div></header>
  <main class="page">
    <section id="tenantView"><div class="page-head"><div><h1>租户管理</h1><p>统一维护外部客户租户的会员等级与每日积分限制。</p></div><span class="sync"><i></i>数据同步正常</span></div><div class="panel"><div class="toolbar"><input id="tenantSearch" class="search" placeholder="搜索租户名称或租户 ID"><select id="tenantLevel"><option value="">全部会员等级</option><option>基础版</option><option>专业版</option><option>企业版</option></select><select id="tenantStatus"><option value="">全部状态</option><option value="active">启用</option><option value="paused">停用</option></select><button class="btn" onclick="resetTenantFilters()">重置</button><span class="spacer"></span><button class="btn" id="tenantBatchBtn" disabled onclick="openBatchTenantModal()">批量修改</button><button class="btn primary" onclick="openAddTenantModal()">新增租户</button></div><div id="tenantSelection" class="summary hidden"></div><table><thead><tr><th><input id="tenantAll" class="check" type="checkbox" aria-label="全选租户"></th><th>租户</th><th>租户 ID</th><th>会员等级</th><th>每日积分限制</th><th>成员数</th><th>状态</th><th>最近更新</th><th>操作</th></tr></thead><tbody id="tenantRows"></tbody></table></div></section>
    <section id="userView" hidden><div class="page-head"><div><h1>用户管理</h1><p>用户信息由钉钉组织架构同步；此处仅管理用户的额度与权限配置。</p></div><span class="sync"><i></i>钉钉组织架构已同步</span></div><div class="panel"><div class="toolbar"><input id="userSearch" class="search" placeholder="搜索姓名、邮箱或用户 ID"><select id="userTenant"><option value="">全部租户</option></select><select id="userRole"><option value="">全部权限</option><option>租户管理员</option><option>普通成员</option></select><select id="userQuotaType"><option value="">全部额度类型</option><option value="inherit">继承租户</option><option value="custom">单独设置</option></select><button class="btn" onclick="resetUserFilters()">重置</button><span class="spacer"></span><button class="btn" id="userBatchBtn" disabled onclick="openBatchUserModal()">批量修改</button></div><div id="userSelection" class="summary hidden"></div><table><thead><tr><th><input id="userAll" class="check" type="checkbox" aria-label="全选用户"></th><th>用户</th><th>所属租户</th><th>权限</th><th>每日积分限制</th><th>同步来源</th><th>最近更新</th><th>操作</th></tr></thead><tbody id="userRows"></tbody></table></div></section>
  </main>
  <div class="modal-mask" id="modalMask" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal"><div class="modal-head"><h2 id="modalTitle">编辑配置</h2><button class="modal-close" type="button" onclick="closeModal()" aria-label="关闭">×</button></div><div class="modal-body" id="modalBody"></div><div class="modal-foot"><button class="btn" type="button" onclick="closeModal()">取消</button><button class="btn primary" type="button" onclick="saveModal()">保存</button></div></div></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
    const storageKey = 'weave-ops-console-v1';
    const initialState = { tenants:[
      {id:'TEN-10021',name:'扬腾创新',level:'企业版',quota:200,members:42,status:'active',updated:'2026-08-11 14:20'},
      {id:'TEN-10039',name:'青梧家居',level:'专业版',quota:120,members:18,status:'active',updated:'2026-08-11 10:08'},
      {id:'TEN-10052',name:'星海贸易',level:'专业版',quota:100,members:26,status:'active',updated:'2026-08-10 17:42'},
      {id:'TEN-10067',name:'极光生活',level:'基础版',quota:60,members:7,status:'paused',updated:'2026-08-09 09:16'},
      {id:'TEN-10081',name:'森屿品牌',level:'企业版',quota:300,members:58,status:'active',updated:'2026-08-08 16:30'}
    ],users:[
      {id:'USR-3091',name:'杨修瑛',email:'yang@yangteng.com',tenantId:'TEN-10021',role:'租户管理员',quota:null,updated:'2026-08-11 14:20'},
      {id:'USR-3092',name:'林思雨',email:'lin@yangteng.com',tenantId:'TEN-10021',role:'普通成员',quota:null,updated:'2026-08-11 09:38'},
      {id:'USR-3093',name:'陈嘉铭',email:'chen@yangteng.com',tenantId:'TEN-10021',role:'普通成员',quota:300,updated:'2026-08-10 11:26'},
      {id:'USR-4281',name:'周婧',email:'zhoujing@qingwu.com',tenantId:'TEN-10039',role:'租户管理员',quota:null,updated:'2026-08-11 10:08'},
      {id:'USR-4282',name:'何雨桐',email:'heyutong@qingwu.com',tenantId:'TEN-10039',role:'普通成员',quota:160,updated:'2026-08-10 15:32'},
      {id:'USR-5177',name:'徐薇',email:'xuwei@xinghai.com',tenantId:'TEN-10052',role:'租户管理员',quota:null,updated:'2026-08-10 17:42'},
      {id:'USR-5178',name:'方圆',email:'fangyuan@xinghai.com',tenantId:'TEN-10052',role:'普通成员',quota:null,updated:'2026-08-09 18:04'}
    ]};
    let state; let selectedTenants=new Set(); let selectedUsers=new Set(); let modalState=null;
    function copyInitial(){return JSON.parse(JSON.stringify(initialState));} function load(){try{const value=JSON.parse(localStorage.getItem(storageKey));if(value&&Array.isArray(value.tenants)&&Array.isArray(value.users))return value;}catch(e){}return copyInitial();} function persist(){localStorage.setItem(storageKey,JSON.stringify(state));} function tenantById(id){return state.tenants.find(t=>t.id===id);} function levelClass(level){return level==='企业版'?'enterprise':level==='专业版'?'pro':'basic';} function initials(name){return name.slice(0,1);}
    function filteredTenants(){const q=document.getElementById('tenantSearch').value.trim().toLowerCase(),level=document.getElementById('tenantLevel').value,status=document.getElementById('tenantStatus').value;return state.tenants.filter(t=>(!q||t.name.toLowerCase().includes(q)||t.id.toLowerCase().includes(q))&&(!level||t.level===level)&&(!status||t.status===status));}
    function renderTenants(){const rows=filteredTenants();const tbody=document.getElementById('tenantRows');tbody.innerHTML=rows.length?rows.map(t=>`<tr><td><input class="check tenant-check" type="checkbox" value="${t.id}" ${selectedTenants.has(t.id)?'checked':''}></td><td><div class="entity"><span class="avatar">${initials(t.name)}</span><span><b>${t.name}</b><span>${t.status==='active'?'服务中':'已停用'}</span></span></div></td><td class="subtle">${t.id}</td><td><span class="tag ${levelClass(t.level)}">${t.level}</span></td><td><span class="quota">${t.quota} 积分 / 天</span></td><td>${t.members}</td><td><span class="tag ${t.status}">${t.status==='active'?'启用':'停用'}</span></td><td class="subtle">${t.updated}</td><td><button class="row-edit" onclick="openTenantModal('${t.id}')">编辑</button></td></tr>`).join(''):'<tr><td colspan="9" class="empty">未找到匹配的租户</td></tr>';document.querySelectorAll('.tenant-check').forEach(c=>c.addEventListener('change',()=>{c.checked?selectedTenants.add(c.value):selectedTenants.delete(c.value);syncTenantSelection();}));document.getElementById('tenantAll').checked=rows.length>0&&rows.every(t=>selectedTenants.has(t.id));syncTenantSelection();}
    function syncTenantSelection(){const n=selectedTenants.size,summary=document.getElementById('tenantSelection'),btn=document.getElementById('tenantBatchBtn');btn.disabled=!n;summary.classList.toggle('hidden',!n);summary.innerHTML=n?`已选择 <strong>${n}</strong> 个租户 <button class="row-edit" onclick="selectedTenants.clear();renderTenants()">取消选择</button>`:'';}
    function filteredUsers(){const q=document.getElementById('userSearch').value.trim().toLowerCase(),tenant=document.getElementById('userTenant').value,role=document.getElementById('userRole').value,type=document.getElementById('userQuotaType').value;return state.users.filter(u=>(!q||u.name.toLowerCase().includes(q)||u.email.toLowerCase().includes(q)||u.id.toLowerCase().includes(q))&&(!tenant||u.tenantId===tenant)&&(!role||u.role===role)&&(!type||(type==='inherit'?u.quota===null:u.quota!==null)));}
    function renderUserTenantOptions(){const select=document.getElementById('userTenant'),current=select.value;select.innerHTML='<option value="">全部租户</option>'+state.tenants.map(t=>`<option value="${t.id}">${t.name}</option>`).join('');select.value=current;}
    function renderUsers(){const users=filteredUsers(),tbody=document.getElementById('userRows');tbody.innerHTML=users.length?users.map(u=>{const t=tenantById(u.tenantId),quota=u.quota===null?t.quota:u.quota;return `<tr><td><input class="check user-check" type="checkbox" value="${u.id}" ${selectedUsers.has(u.id)?'checked':''}></td><td><div class="entity"><span class="avatar">${initials(u.name)}</span><span><b>${u.name}</b><span>${u.email}<span></span></span></span></div></td><td>${t.name}</td><td>${u.role}</td><td><span class="quota">${quota} 积分 / 天</span><span class="inherit">${u.quota===null?'继承租户设置':'单独设置'}</span></td><td class="subtle">钉钉组织架构</td><td class="subtle">${u.updated}</td><td><button class="row-edit" onclick="openUserModal('${u.id}')">编辑</button></td></tr>`;}).join(''):'<tr><td colspan="8" class="empty">未找到匹配的用户</td></tr>';document.querySelectorAll('.user-check').forEach(c=>c.addEventListener('change',()=>{c.checked?selectedUsers.add(c.value):selectedUsers.delete(c.value);syncUserSelection();}));document.getElementById('userAll').checked=users.length>0&&users.every(u=>selectedUsers.has(u.id));syncUserSelection();}
    function syncUserSelection(){const n=selectedUsers.size,summary=document.getElementById('userSelection'),btn=document.getElementById('userBatchBtn');btn.disabled=!n;summary.classList.toggle('hidden',!n);summary.innerHTML=n?`已选择 <strong>${n}</strong> 个用户 <button class="row-edit" onclick="selectedUsers.clear();renderUsers()">取消选择</button>`:'';}
    function bindFilters(){['tenantSearch','tenantLevel','tenantStatus'].forEach(id=>document.getElementById(id).addEventListener('input',renderTenants));['userSearch','userTenant','userRole','userQuotaType'].forEach(id=>document.getElementById(id).addEventListener('input',renderUsers));document.getElementById('tenantAll').addEventListener('change',e=>{filteredTenants().forEach(t=>e.target.checked?selectedTenants.add(t.id):selectedTenants.delete(t.id));renderTenants();});document.getElementById('userAll').addEventListener('change',e=>{filteredUsers().forEach(u=>e.target.checked?selectedUsers.add(u.id):selectedUsers.delete(u.id));renderUsers();});}
    function resetTenantFilters(){document.getElementById('tenantSearch').value='';document.getElementById('tenantLevel').value='';document.getElementById('tenantStatus').value='';renderTenants();} function resetUserFilters(){document.getElementById('userSearch').value='';document.getElementById('userTenant').value='';document.getElementById('userRole').value='';document.getElementById('userQuotaType').value='';renderUsers();}
    function openModal(title,body,data){modalState=data;document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modalMask').classList.add('open');} function closeModal(){document.getElementById('modalMask').classList.remove('open');modalState=null;} function quotaField(value='',optional=false){return `<div class="field"><label for="modalQuota">每日积分限制${optional?'（可不修改）':''}</label><input id="modalQuota" type="number" min="1" max="10000" value="${value}" placeholder="例如 200"><div class="hint">输入 1–10,000 的整数。${optional?'留空则不调整该项。':''}</div></div>`;} function levelField(value='',optional=false){return `<div class="field"><label for="modalLevel">会员等级${optional?'（可不修改）':''}</label><select id="modalLevel"><option value="">${optional?'保持不变':'请选择会员等级'}</option>${['基础版','专业版','企业版'].map(x=>`<option ${x===value?'selected':''}>${x}</option>`).join('')}</select></div>`;}
    function openTenantModal(id){const t=tenantById(id);openModal(`编辑租户 · ${t.name}`,`<p class="modal-desc">修改后将应用于该客户租户的新任务与继承默认额度的成员。</p>${levelField(t.level)}${quotaField(t.quota)}`,{type:'tenant',ids:[id]});} function openBatchTenantModal(){openModal(`批量修改 ${selectedTenants.size} 个租户`,`<p class="modal-desc">仅会更新你填写的字段；留空的字段保持不变。</p>${levelField('',true)}${quotaField('',true)}`,{type:'tenant-batch',ids:[...selectedTenants]});} function openAddTenantModal(){openModal('新增租户',`<p class="modal-desc">创建后可继续在“用户管理”中查看钉钉同步的成员。</p><div class="field"><label for="modalName">租户名称</label><input id="modalName" placeholder="请输入客户公司名称"></div>${levelField()}${quotaField()}`,{type:'tenant-add'});}
    function openUserModal(id){const u=state.users.find(x=>x.id===id),t=tenantById(u.tenantId);openModal(`编辑用户 · ${u.name}`,`<p class="modal-desc">用户基础信息由钉钉同步，此处仅调整角色与每日积分额度。</p><div class="field"><label for="modalRole">用户权限</label><select id="modalRole"><option ${u.role==='普通成员'?'selected':''}>普通成员</option><option ${u.role==='租户管理员'?'selected':''}>租户管理员</option></select></div><div class="field"><label for="quotaMode">额度类型</label><select id="quotaMode" onchange="toggleQuotaInput()"><option value="inherit" ${u.quota===null?'selected':''}>继承租户默认（${t.quota} 积分 / 天）</option><option value="custom" ${u.quota!==null?'selected':''}>单独设置</option></select></div><div id="userQuotaInput">${quotaField(u.quota===null?'':u.quota)}</div>`,{type:'user',ids:[id]});toggleQuotaInput();} function openBatchUserModal(){openModal(`批量修改 ${selectedUsers.size} 个用户`,`<p class="modal-desc">可以批量修改角色与积分额度。每日积分留空则不调整。</p><div class="field"><label for="modalRole">用户权限（可不修改）</label><select id="modalRole"><option value="">保持不变</option><option>普通成员</option><option>租户管理员</option></select></div><div class="field"><label for="quotaMode">额度类型（可不修改）</label><select id="quotaMode"><option value="">保持不变</option><option value="inherit">恢复继承租户默认</option><option value="custom">单独设置</option></select></div>${quotaField('',true)}`,{type:'user-batch',ids:[...selectedUsers]});}
    function toggleQuotaInput(){const mode=document.getElementById('quotaMode');const input=document.getElementById('modalQuota');if(mode&&input){input.disabled=mode.value==='inherit';if(mode.value==='inherit')input.value='';}}
    function saveModal(){const m=modalState;if(!m)return;const quotaInput=document.getElementById('modalQuota'),quota=quotaInput&&quotaInput.value===''?null:Number(quotaInput&&quotaInput.value);if(quota!==null&&(!Number.isInteger(quota)||quota<1||quota>10000)){toast('每日积分限制应为 1–10,000 的整数');return;}if(m.type==='tenant'||m.type==='tenant-batch'){const level=document.getElementById('modalLevel').value;m.ids.forEach(id=>{const t=tenantById(id);if(level)t.level=level;if(quota!==null)t.quota=quota;t.updated='2026-08-11 16:40';});selectedTenants.clear();toast('租户配置已保存');}else if(m.type==='tenant-add'){const name=document.getElementById('modalName').value.trim(),level=document.getElementById('modalLevel').value;if(!name||!level||quota===null){toast('请完整填写租户名称、会员等级和每日积分限制');return;}const id=`TEN-${String(Date.now()).slice(-5)}`;state.tenants.unshift({id,name,level,quota,members:0,status:'active',updated:'2026-08-11 16:40'});toast('新租户已创建');}else {const role=document.getElementById('modalRole').value,mode=document.getElementById('quotaMode').value;m.ids.forEach(id=>{const u=state.users.find(x=>x.id===id);if(role)u.role=role;if(mode==='inherit')u.quota=null;if(mode==='custom'&&quota!==null)u.quota=quota;u.updated='2026-08-11 16:40';});selectedUsers.clear();toast('用户配置已保存');}persist();closeModal();renderUserTenantOptions();renderTenants();renderUsers();}
    function toast(text){const el=document.getElementById('toast');el.textContent=text;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2500);} function setView(view){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));document.getElementById('tenantView').hidden=view!=='tenant';document.getElementById('userView').hidden=view!=='user';}
    function init(){state=load();renderUserTenantOptions();renderTenants();renderUsers();bindFilters();document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));} init();
  </script>
</body>
