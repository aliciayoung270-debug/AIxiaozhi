<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>技能库 · AI 小织</title>
  <link rel="stylesheet" href="shared.css?v=20261023-sidebar">
  <style>
    /* ─── Skills Page Layout ──────────────────────────────── */
    .skills-main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--color-bg-base);
    }

    /* ─── Page Header ─────────────────────────────────────── */
    .page-header {
      padding: var(--space-8) var(--space-8) 0;
      flex-shrink: 0;
    }
    .page-title {
      font-family: var(--font-serif);
      font-size: var(--text-2xl);
      font-weight: var(--font-semibold);
      color: var(--color-text-primary);
      line-height: var(--leading-tight);
      margin-bottom: var(--space-1);
    }
    .page-subtitle {
      font-size: var(--text-sm);
      color: var(--color-text-tertiary);
      line-height: var(--leading-normal);
    }

    /* ─── Tabs ────────────────────────────────────────────── */
    .tabs-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-6) var(--space-8) 0;
      flex-shrink: 0;
    }
    .tabs {
      display: flex;
      gap: 0;
      background: var(--color-bg-sunken);
      border-radius: var(--radius-md);
      padding: 3px;
    }
    .tab-btn {
      padding: 6px var(--space-5);
      font-size: var(--text-sm);
      font-weight: var(--font-medium);
      color: var(--color-text-tertiary);
      border-radius: calc(var(--radius-md) - 2px);
      transition: background var(--duration-fast), color var(--duration-fast), box-shadow var(--duration-fast);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    .tab-btn:hover { color: var(--color-text-secondary); }
    .tab-btn.active {
      background: var(--color-bg-surface);
      color: var(--color-text-primary);
      font-weight: var(--font-semibold);
      box-shadow: var(--shadow-xs);
    }

    /* ─── Filter ──────────────────────────────────────────── */
    .filter-group {
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }
    .filter-label {
      font-size: var(--text-xs);
      color: var(--color-text-tertiary);
    }
    .filter-pills {
      display: flex;
      gap: var(--space-1);
      background: var(--color-bg-sunken);
      border-radius: var(--radius-sm);
      padding: 2px;
    }
    .filter-pill {
      padding: 4px var(--space-3);
      font-size: var(--text-xs);
      font-weight: var(--font-medium);
      color: var(--color-text-tertiary);
      border-radius: calc(var(--radius-sm) - 1px);
      cursor: pointer;
      transition: background var(--duration-fast), color var(--duration-fast);
      user-select: none;
    }
    .filter-pill:hover { color: var(--color-text-secondary); }
    .filter-pill.active {
      background: var(--color-bg-surface);
      color: var(--color-text-primary);
      box-shadow: var(--shadow-xs);
    }

    /* ─── Tab Divider ─────────────────────────────────────── */
    .tab-divider {
      height: 1px;
      background: var(--color-border-subtle);
      margin: var(--space-4) var(--space-8) 0;
      flex-shrink: 0;
    }

    /* ─── Skills Grid ─────────────────────────────────────── */
    .skills-body {
      flex: 1;
      overflow-y: auto;
      padding: var(--space-6) var(--space-8) var(--space-8);
    }
    .skills-body::-webkit-scrollbar { width: 4px; }
    .skills-body::-webkit-scrollbar-thumb { background: var(--color-border-default); border-radius: 2px; }

    .skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: var(--space-4);
    }

    /* ─── Skill Card ──────────────────────────────────────── */
    .skill-card {
      background: var(--color-bg-surface);
      border: 1px solid var(--color-border-subtle);
      border-radius: var(--radius-lg);
      padding: var(--space-5);
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
      transition: transform var(--duration-normal) var(--ease-in-out),
                  box-shadow var(--duration-normal) var(--ease-in-out),
                  border-color var(--duration-normal);
    }
    .skill-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      border-color: var(--color-border-default);
    }
    .skill-card.enabled {
      border-color: var(--color-accent-subtle);
    }

    .skill-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--space-3);
    }
    .skill-icon {
      width: 36px;
      height: 36px;
      background: var(--color-bg-sunken);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--color-accent);
    }
    .skill-icon svg { width: 18px; height: 18px; }

    .skill-enabled-dot {
      width: 8px;
      height: 8px;
      border-radius: var(--radius-full);
      background: var(--color-success);
      flex-shrink: 0;
      margin-top: 4px;
      opacity: 0;
      transition: opacity var(--duration-fast);
    }
    .skill-card.enabled .skill-enabled-dot { opacity: 1; }

    .skill-card-body { flex: 1; }
    .skill-name {
      font-size: var(--text-base);
      font-weight: var(--font-semibold);
      color: var(--color-text-primary);
      margin-bottom: var(--space-2);
      line-height: var(--leading-tight);
    }
    .skill-desc {
      font-size: var(--text-sm);
      color: var(--color-text-tertiary);
      line-height: var(--leading-relaxed);
    }

    .skill-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
    }
    .skill-tags {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-1);
      flex: 1;
      min-width: 0;
    }
    .skill-tag {
      font-size: var(--text-xs);
      color: var(--color-text-tertiary);
      background: var(--color-bg-sunken);
      border: 1px solid var(--color-border-subtle);
      padding: 2px var(--space-2);
      border-radius: var(--radius-sm);
      white-space: nowrap;
    }

    /* ─── Buttons ─────────────────────────────────────────── */
    .btn-enable {
      padding: 6px var(--space-4);
      font-size: var(--text-xs);
      font-weight: var(--font-semibold);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all var(--duration-fast) var(--ease-in-out);
      white-space: nowrap;
      flex-shrink: 0;
      border: 1px solid transparent;
    }
    .btn-enable.add {
      background: var(--color-charcoal);
      color: var(--color-text-inverse);
      border-color: var(--color-charcoal);
    }
    .btn-enable.add:hover {
      background: #1a1816;
      border-color: #1a1816;
    }
    .btn-enable.remove {
      background: transparent;
      color: var(--color-text-secondary);
      border-color: var(--color-border-default);
    }
    .btn-enable.remove:hover {
      background: var(--color-bg-sunken);
      border-color: var(--color-border-strong);
      color: var(--color-text-primary);
    }
    .btn-delete {
      padding: 6px var(--space-4);
      font-size: var(--text-xs);
      font-weight: var(--font-semibold);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all var(--duration-fast) var(--ease-in-out);
      white-space: nowrap;
      flex-shrink: 0;
      border: 1px solid var(--color-border-default);
      background: transparent;
      color: var(--color-text-secondary);
    }
    .btn-delete:hover {
      background: #fdf0ef;
      border-color: var(--color-error);
      color: var(--color-error);
    }

    /* ─── Empty State ─────────────────────────────────────── */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-20) var(--space-8);
      text-align: center;
      gap: var(--space-4);
    }
    .empty-icon {
      width: 52px;
      height: 52px;
      background: var(--color-bg-sunken);
      border-radius: var(--radius-xl);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-text-tertiary);
    }
    .empty-title {
      font-size: var(--text-lg);
      font-weight: var(--font-semibold);
      color: var(--color-text-primary);
    }
    .empty-desc {
      font-size: var(--text-sm);
      color: var(--color-text-tertiary);
      line-height: var(--leading-relaxed);
      max-width: 320px;
    }
    .empty-hint {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      padding: var(--space-3) var(--space-4);
      background: var(--color-bg-surface);
      border: 1px solid var(--color-border-subtle);
      border-radius: var(--radius-md);
      font-size: var(--text-sm);
      color: var(--color-text-secondary);
    }
    .empty-hint svg { color: var(--color-accent); flex-shrink: 0; }

    /* ─── Section Count ───────────────────────────────────── */
    .skills-count {
      font-size: var(--text-xs);
      color: var(--color-text-tertiary);
      margin-bottom: var(--space-4);
    }

    /* ─── Delete Modal ────────────────────────────────────── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(46, 43, 40, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--duration-normal) var(--ease-in-out);
    }
    .modal-overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }
    .modal {
      background: var(--color-bg-surface);
      border: 1px solid var(--color-border-default);
      border-radius: var(--radius-xl);
      padding: var(--space-6);
      width: 360px;
      max-width: calc(100vw - var(--space-8));
      box-shadow: var(--shadow-xl);
      transform: translateY(8px) scale(0.98);
      transition: transform var(--duration-slow) cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .modal-overlay.visible .modal {
      transform: translateY(0) scale(1);
    }
    .modal-icon {
      width: 40px;
      height: 40px;
      background: #fdf0ef;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-error);
      margin-bottom: var(--space-4);
    }
    .modal-title {
      font-size: var(--text-lg);
      font-weight: var(--font-semibold);
      color: var(--color-text-primary);
      margin-bottom: var(--space-2);
    }
    .modal-desc {
      font-size: var(--text-sm);
      color: var(--color-text-secondary);
      line-height: var(--leading-relaxed);
      margin-bottom: var(--space-6);
    }
    .modal-desc strong {
      color: var(--color-text-primary);
      font-weight: var(--font-semibold);
    }
    .modal-actions {
      display: flex;
      gap: var(--space-2);
      justify-content: flex-end;
    }
    .btn-modal-cancel {
      padding: 8px var(--space-4);
      font-size: var(--text-sm);
      font-weight: var(--font-medium);
      border-radius: var(--radius-md);
      border: 1px solid var(--color-border-default);
      background: transparent;
      color: var(--color-text-secondary);
      cursor: pointer;
      transition: all var(--duration-fast);
    }
    .btn-modal-cancel:hover {
      background: var(--color-bg-sunken);
      color: var(--color-text-primary);
    }
    .btn-modal-confirm {
      padding: 8px var(--space-5);
      font-size: var(--text-sm);
      font-weight: var(--font-semibold);
      border-radius: var(--radius-md);
      border: none;
      background: var(--color-error);
      color: var(--color-text-inverse);
      cursor: pointer;
      transition: all var(--duration-fast);
    }
    .btn-modal-confirm:hover { background: #8c3a31; }

    /* ─── Tab Panel visibility ────────────────────────────── */
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
  </style>
  <script src="sidebar.js?v=20261023-sidebar" defer></script>
</head>
<body>
<div class="app">

  <!-- ── Sidebar ─────────────────────────────────────────── -->
  <aside class="sidebar" data-shared-sidebar data-page="skills" aria-label="主导航"></aside>

  <!-- ── Main ────────────────────────────────────────────── -->
  <main class="skills-main">

    <!-- Page Header -->
    <div class="page-header">
      <h1 class="page-title">技能库</h1>
      <p class="page-subtitle">启用技能后，小织可以在对话中调用对应能力</p>
    </div>

    <!-- Tabs + Filter -->
    <div class="tabs-bar">
      <div class="tabs">
        <div class="tab-btn active" onclick="switchTab('system')">系统</div>
        <div class="tab-btn" onclick="switchTab('tenant')">租户</div>
        <div class="tab-btn" onclick="switchTab('user')">我的技能</div>
      </div>

      <!-- Filter: only shown for system and tenant tabs -->
      <div class="filter-group" id="filter-group">
        <span class="filter-label">显示</span>
        <div class="filter-pills" id="filter-pills-system">
          <div class="filter-pill active" onclick="setFilter('system','all',this)">全部</div>
          <div class="filter-pill" onclick="setFilter('system','enabled',this)">已启用</div>
        </div>
        <div class="filter-pills hidden" id="filter-pills-tenant">
          <div class="filter-pill active" onclick="setFilter('tenant','all',this)">全部</div>
          <div class="filter-pill" onclick="setFilter('tenant','enabled',this)">已启用</div>
        </div>
      </div>
    </div>

    <div class="tab-divider"></div>

    <!-- Tab Panels -->
    <div class="skills-body">

      <!-- System Tab -->
      <div class="tab-panel active" id="panel-system">
        <div class="skills-count" id="count-system"></div>
        <div class="skills-grid" id="grid-system"></div>
        <div class="empty-state hidden" id="empty-system">
          <div class="empty-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </div>
          <div class="empty-title">没有已启用的系统技能</div>
          <div class="empty-desc">切换到「全部」可以浏览并启用你需要的系统技能</div>
        </div>
      </div>

      <!-- Tenant Tab -->
      <div class="tab-panel" id="panel-tenant">
        <div class="skills-count" id="count-tenant"></div>
        <div class="skills-grid" id="grid-tenant"></div>
        <div class="empty-state hidden" id="empty-tenant">
          <div class="empty-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </div>
          <div class="empty-title">没有已启用的租户技能</div>
          <div class="empty-desc">切换到「全部」可以浏览并启用租户定制的技能</div>
        </div>
      </div>

      <!-- User Tab -->
      <div class="tab-panel" id="panel-user">
        <div class="skills-grid" id="grid-user"></div>
        <div class="empty-state hidden" id="empty-user">
          <div class="empty-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          </div>
          <div class="empty-title">还没有自定义技能</div>
          <div class="empty-desc">在对话中描述你想要的技能，小织会帮你创建并保存在这里</div>
          <div class="empty-hint">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            试着说：「帮我创建一个竞品价格监控的技能」
          </div>
        </div>
      </div>

    </div>
  </main>
</div>

<!-- ── Delete Confirm Modal ──────────────────────────── -->
<div class="modal-overlay" id="delete-modal" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
    </div>
    <div class="modal-title">删除技能</div>
    <div class="modal-desc">确认删除 <strong id="modal-skill-name"></strong>？删除后无法恢复，如需再次使用需重新创建。</div>
    <div class="modal-actions">
      <button class="btn-modal-cancel" onclick="closeDeleteModal()">取消</button>
      <button class="btn-modal-confirm" onclick="confirmDelete()">确认删除</button>
    </div>
  </div>
</div>

<script>
  // ─── Data ───────────────────────────────────────────────
  const systemSkills = [
    {
      id: 's1', name: '广告诊断分析', enabled: true,
      desc: '自动分析广告账户表现，识别预算浪费、出价异常与流量质量问题，生成优化建议报告。',
      tags: ['广告', '诊断', '自动化'],
      icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>`
    },
    {
      id: 's2', name: '关键词挖掘', enabled: true,
      desc: '基于竞品 ASIN 和品类词，批量挖掘高潜力长尾关键词，输出搜索量与竞争度评估。',
      tags: ['关键词', '选词', 'SEO'],
      icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>`
    },
    {
      id: 's3', name: '竞品监控', enabled: false,
      desc: '定期追踪竞品价格、评分、排名变化，当出现显著波动时自动推送预警通知。',
      tags: ['竞品', '监控', '预警'],
      icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`
    },
    {
      id: 's4', name: '投放策略生成', enabled: false,
      desc: '根据产品生命周期、库存深度和季节因素，智能生成 SP / SB / SD 分层投放策略。',
      tags: ['策略', '投放', '自动化'],
      icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`
    },
    {
      id: 's5', name: '周报自动生成', enabled: true,
      desc: '汇总本周广告数据、销量趋势与核心异动，一键生成结构化周报，支持导出 PDF。',
      tags: ['报告', '周报', '效率'],
      icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>`
    },
    {
      id: 's6', name: '预算分配优化', enabled: false,
      desc: '基于 ROAS 目标和历史数据，动态计算各广告活动的最优预算分配比例，减少人工调配。',
      tags: ['预算', '优化', 'ROAS'],
      icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>`
    },
  ];

  const tenantSkills = [
    {
      id: 't1', name: '大促备战助手', enabled: true,
      desc: '针对 Prime Day、黑五等大促节点，自动评估库存缺口、设置预算上限并生成应急预案。',
      tags: ['大促', '备战', '定制'],
      icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>`
    },
    {
      id: 't2', name: '站内外联动分析', enabled: false,
      desc: '打通站内广告数据与站外流量来源，量化各渠道对 BSR 排名提升的贡献度。',
      tags: ['站外', '联动', '分析'],
      icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>`
    },
    {
      id: 't3', name: '退货率归因', enabled: true,
      desc: '分析退货评论与产品描述差异，定位 Listing 表达问题，输出优化建议降低退货率。',
      tags: ['退货', '归因', '定制'],
      icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.51"/></svg>`
    },
    {
      id: 't4', name: '多账户汇总看板', enabled: false,
      desc: '将旗下多个 Seller / Vendor 账户数据聚合展示，支持跨账户对比与合并报告导出。',
      tags: ['多账户', '汇总', '看板'],
      icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>`
    },
  ];

  const userSkills = [
    {
      id: 'u1', name: '美国站 B0GWT 专项监控',
      desc: '每日拉取 B0GWTWVWYF 广告数据，对比前一周同期表现，若 ACOS 超过 30% 自动提醒。',
      tags: ['自定义', '监控'],
      icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/></svg>`
    },
    {
      id: 'u2', name: '竞品五星评论提取',
      desc: '抓取指定竞品 ASIN 的五星评论，提炼高频正向关键词，用于优化自家 Listing 卖点。',
      tags: ['自定义', '竞品', '评论'],
      icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>`
    },
  ];

  // ─── State ──────────────────────────────────────────────
  const filterState = { system: 'all', tenant: 'all' };
  let pendingDeleteId = null;
  let activeTab = 'system';

  // ─── Render ─────────────────────────────────────────────
  function renderCard(skill, type) {
    const isUser = type === 'user';
    const enabledClass = (!isUser && skill.enabled) ? 'enabled' : '';
    const tagsHtml = skill.tags.map(t => `<span class="skill-tag">${t}</span>`).join('');
    const actionBtn = isUser
      ? `<button class="btn-delete" onclick="openDeleteModal('${skill.id}','${skill.name}')">删除</button>`
      : skill.enabled
        ? `<button class="btn-enable remove" onclick="toggleSkill('${type}','${skill.id}',this)">移除</button>`
        : `<button class="btn-enable add" onclick="toggleSkill('${type}','${skill.id}',this)">启用</button>`;

    return `
      <div class="skill-card ${enabledClass}" id="card-${skill.id}">
        <div class="skill-card-top">
          <div class="skill-icon">${skill.icon}</div>
          ${!isUser ? '<div class="skill-enabled-dot"></div>' : ''}
        </div>
        <div class="skill-card-body">
          <div class="skill-name">${skill.name}</div>
          <div class="skill-desc">${skill.desc}</div>
        </div>
        <div class="skill-card-footer">
          <div class="skill-tags">${tagsHtml}</div>
          ${actionBtn}
        </div>
      </div>`;
  }

  function renderGrid(type) {
    const isUser = type === 'user';
    const data = type === 'system' ? systemSkills : type === 'tenant' ? tenantSkills : userSkills;
    const filter = isUser ? null : filterState[type];

    const filtered = filter === 'enabled' ? data.filter(s => s.enabled) : data;

    const grid = document.getElementById(`grid-${type}`);
    const empty = document.getElementById(`empty-${type}`);
    const count = document.getElementById(`count-${type}`);

    if (filtered.length === 0) {
      grid.innerHTML = '';
      grid.classList.add('hidden');
      empty.classList.remove('hidden');
    } else {
      grid.innerHTML = filtered.map(s => renderCard(s, type)).join('');
      grid.classList.remove('hidden');
      empty.classList.add('hidden');
    }

    if (count) {
      const enabledCount = data.filter(s => s.enabled).length;
      count.textContent = filter === 'enabled'
        ? `${filtered.length} 个已启用`
        : `共 ${data.length} 个技能 · ${enabledCount} 个已启用`;
    }
  }

  function renderAll() {
    renderGrid('system');
    renderGrid('tenant');
    renderGrid('user');
    checkUserEmpty();
  }

  function checkUserEmpty() {
    const grid = document.getElementById('grid-user');
    const empty = document.getElementById('empty-user');
    if (userSkills.length === 0) {
      grid.classList.add('hidden');
      empty.classList.remove('hidden');
    } else {
      grid.classList.remove('hidden');
      empty.classList.add('hidden');
    }
  }

  // ─── Tab Switch ──────────────────────────────────────────
  function switchTab(tab) {
    activeTab = tab;
    document.querySelectorAll('.tab-btn').forEach((el, i) => {
      el.classList.toggle('active', ['system','tenant','user'][i] === tab);
    });
    document.querySelectorAll('.tab-panel').forEach(el => el.classList.remove('active'));
    document.getElementById(`panel-${tab}`).classList.add('active');

    // Filter visibility
    const filterGroup = document.getElementById('filter-group');
    filterGroup.style.visibility = tab === 'user' ? 'hidden' : 'visible';

    // Show correct filter pills
    document.getElementById('filter-pills-system').classList.toggle('hidden', tab !== 'system');
    document.getElementById('filter-pills-tenant').classList.toggle('hidden', tab !== 'tenant');
  }

  // ─── Filter ─────────────────────────────────────────────
  function setFilter(type, value, el) {
    filterState[type] = value;
    el.closest('.filter-pills').querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
    el.classList.add('active');
    renderGrid(type);
  }

  // ─── Toggle Enable ───────────────────────────────────────
  function toggleSkill(type, id, btn) {
    const data = type === 'system' ? systemSkills : tenantSkills;
    const skill = data.find(s => s.id === id);
    if (!skill) return;

    skill.enabled = !skill.enabled;

    const card = document.getElementById(`card-${id}`);
    if (skill.enabled) {
      card.classList.add('enabled');
      btn.textContent = '移除';
      btn.className = 'btn-enable remove';
      btn.onclick = () => toggleSkill(type, id, btn);
    } else {
      card.classList.remove('enabled');
      btn.textContent = '启用';
      btn.className = 'btn-enable add';
      btn.onclick = () => toggleSkill(type, id, btn);
    }

    // If filter is 'enabled' and we just removed, re-render
    if (filterState[type] === 'enabled' && !skill.enabled) {
      setTimeout(() => renderGrid(type), 150);
    }

    // Update count
    const countEl = document.getElementById(`count-${type}`);
    if (countEl) {
      const enabledCount = data.filter(s => s.enabled).length;
      countEl.textContent = filterState[type] === 'enabled'
        ? `${data.filter(s => s.enabled).length} 个已启用`
        : `共 ${data.length} 个技能 · ${enabledCount} 个已启用`;
    }
  }

  // ─── Delete Modal ────────────────────────────────────────
  function openDeleteModal(id, name) {
    pendingDeleteId = id;
    document.getElementById('modal-skill-name').textContent = name;
    document.getElementById('delete-modal').classList.add('visible');
  }

  function closeDeleteModal() {
    document.getElementById('delete-modal').classList.remove('visible');
    pendingDeleteId = null;
  }

  function closeModal(e) {
    if (e.target === e.currentTarget) closeDeleteModal();
  }

  function confirmDelete() {
    if (!pendingDeleteId) return;
    const idx = userSkills.findIndex(s => s.id === pendingDeleteId);
    if (idx !== -1) {
      const card = document.getElementById(`card-${pendingDeleteId}`);
      if (card) {
        card.style.transition = 'opacity 200ms ease, transform 200ms ease';
        card.style.opacity = '0';
        card.style.transform = 'scale(0.96)';
        setTimeout(() => {
          userSkills.splice(idx, 1);
          renderGrid('user');
          checkUserEmpty();
        }, 200);
      }
    }
    closeDeleteModal();
  }

  // ─── Init ────────────────────────────────────────────────
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', renderAll);
  } else {
    renderAll();
  }
</script>
</body>
</html>
